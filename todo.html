<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="todo.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
</head>
<body>
    <div class="main_container">
        
        <div class="todo_card">

            <h1 class="title">
                Todo App
            </h1>

            <input class="search_box" type="text" id="taskInput" placeholder="Enter Task ">
            <div class="tasks">
                
                <div class="task">
                    
                    <div id="taskList"> </div>
                    <hr>
                    <time id="time"></time>
                </div>

            <button id="addBtn" class="task_btn">
                Add New Task
            </button>
    </div>
</div>

<script type="module" src="dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="todo.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
</head>
<body>
    <div class="main_container">

        <div class="todo_card">

            <h1 class="title">
                Todo App
            </h1>

            <input class="search_box" type="text" name="new_task" id="new_task" placeholder="Add new task here">
            <div class="tasks">

                <div class="task">
                    <input type="checkbox">
                    learning Django
                    <hr>
                    <time datetime="">2:00pm</time>
                </div>
                
                <div class="task">
                    <input type="checkbox">
                    prayer
                    <hr>
                    <time datetime="">2:00pm</time>
                </div>
                <div class="task">
                    <input class="check_box"  type="checkbox">
                    learning frontend
                    <hr>
                    <time datetime="">2:00pm</time>
                </div>
            </div>

            <button class="task_btn">
                Add New Task
            </button>
    </div>
    </div>
</body>
</html>

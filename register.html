<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="card">

      <h1>Welcome Back</h1>
      <p class="subtitle"">create an account</p>

      <label>Username</label>
      <input type="username" placeholder="Enter your username" id="username">

      <label>Password</label>
      <input id="password"  type="password" placeholder="Enter your password">
      <label>Confirm password</label>
      <input id="confirm_password" type="password" placeholder="confirm password">
      <p><a href="login.html">forgot password?</a></p>

      <button id="registerBtn">Register</button>
      <p id="message"></p>
    </div>
  </div>
  
</body>
<script type="module" src="register.js"></script>
</html>
